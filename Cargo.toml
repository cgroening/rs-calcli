[package]
name = "calcli"
version = "0.7.0"
edition = "2024"
# MSRV: `ratada` relies on let-chains, stabilized in Rust 1.88.
rust-version = "1.88"
authors = ["Corvin Gröning"]
description = "Fast terminal calculator (TUI) with history, variables and engineering helpers"
license = "MIT"
readme = "README.md"
repository = "https://github.com/cgroening/rs-calcli"
homepage = "https://github.com/cgroening/rs-calcli"
documentation = "https://docs.rs/calcli"
keywords = ["calculator", "tui", "terminal", "units", "cli"]
categories = ["command-line-utilities", "mathematics"]
exclude = ["images/", "screenshots/", ".github/", "todo.md"]

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "calcli"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Comment-preserving edits of config.toml from the settings view.
# https://crates.io/crates/toml_edit
toml_edit = "0.22"
# https://crates.io/crates/regex - word-boundary variable substitution.
regex = "1"
thiserror = "2"
anyhow = "1"
log = { version = "0.4", features = ["std"] }
# Display-width measurement for aligning/truncating TUI columns (wide glyphs = 2).
unicode-width = "0.2"
# Shared TUI toolkit: terminal guard, driver, widgets, theming, keymap,
# input rules, clipboard.
ratada = { path = "../../libs/ratada", version = "0.8" }
# https://crates.io/crates/rink-core - units engine (conversion + unit arithmetic).
# bundle-files embeds the units database so no data files are needed at runtime.
rink-core = { version = "0.9.0", features = ["bundle-files"] }
# https://crates.io/crates/clap - declarative argument parsing, help and version.
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# https://crates.io/crates/insta - snapshot tests of the drawn views.
insta = "1.48.0"

[profile.release]
opt-level = 3
